        }

        function renderAppsPageWithFilter(categoryId, storeId) {
            const container = document.getElementById('appsPage').querySelector('.container');
            if (!container) return;
            let filteredApps = [];
            for (const storeId2 in appData.products) {
                if (appData.products[storeId2]) {
                    let apps = appData.products[storeId2].filter(p => !p.restricted);
                    if (categoryId) apps = apps.filter(p => p.categoryId === categoryId);
                    if (storeId) apps = apps.filter(p => p.storeId === storeId);
                    filteredApps.push(...apps);
                }
            }
            const category = appData.categories.find(c => c.id === categoryId);
            const store = findStoreById(storeId);
            let title = 'تطبيقات';
            if (category) title = `تطبيقات في "${category.name}"`;
            if (store) title = `تطبيقات من "${store.name}"`;

            let html = `
                <div class="section-block">
                    <div class="section-header"><h3>${title}</h3><a onclick="clearFilters()">إلغاء التصفية</a></div>
                    ${filteredApps.length === 0 ? '<div style="padding:12px 16px;color:var(--text-light);">لا توجد تطبيقات</div>' : ''}
                    <div class="horizontal-scroll-3rows">${filteredApps.map(app => appCardHtml(app)).join('')}</div>
                </div>
            `;
            const categories = appData.categories || [];
            if (categories.length && !categoryId) {
                html += `
                    <div class="section-block">
                        <div class="section-header"><h3>📂 تصفح حسب الفئة</h3></div>
                        <div class="category-grid">${categories.slice(0, 12).map(cat => categoryCardOld(cat)).join('')}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function clearFilters() {
            currentFilterCategory = 'all';
            currentFilterStore = 'all';
            switchTab('apps');
        }

        function findStoreById(storeId) {
            for (const cat in appData.stores) {
                const found = appData.stores[cat].find(s => s.id === storeId);
                if (found) return found;
            }
            return null;
        }

        function countProductsInCategory(categoryId) {
            let count = 0;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) count += appData.products[storeId].filter(p => p.categoryId === categoryId).length;
            }
            return count;
        }

        // ============================================================
        // مودال الدفع
        // ============================================================
        function openPaymentModal(appId) {
            let app = null;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const found = appData.products[storeId].find(p => p.id === appId);
                    if (found) { app = found; break; }
                }
            }
            if (!app) return;
            pendingPaymentAppId = appId;
            document.getElementById('paymentAmount').textContent = `${app.price || 0} ${appData.settings?.currency || 'ر.س'}`;
            document.getElementById('paymentModal').classList.add('open');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('open');
            pendingPaymentAppId = null;
        }

        function simulatePayment(method) {
            if (!pendingPaymentAppId) return;
            const appId = pendingPaymentAppId;
            if (window.markProductAsPurchased) window.markProductAsPurchased(appId);
            if (!appData.purchasedProducts) appData.purchasedProducts = [];
            if (!appData.purchasedProducts.includes(appId)) {
                appData.purchasedProducts.push(appId);
                window.saveAppData(appData, ['purchasedProducts']).catch(console.error);
            }
            closePaymentModal();
            alert('✅ تم شراء التطبيق بنجاح! يمكنك الآن تثبيته.');
            renderAll();
        }

        // ============================================================
        // شاشة تفاصيل التطبيق
        // ============================================================
        function openAppDetail(appId) {
            let app = null;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const found = appData.products[storeId].find(p => p.id === appId);
                    if (found) { app = found; break; }
                }
            }
            if (!app) return;
            currentDetailAppId = appId;
            const overlay = document.getElementById('appDetailOverlay');
            const container = document.getElementById('appDetailContent');

            const category = appData.categories.find(c => c.id === app.categoryId);
            const categoryName = category ? category.name : '';
            const ratingStars = app.rating ? '★ '.repeat(Math.floor(app.rating)) + (app.rating % 1 >= 0.5 ? '½' : '') : '';

            const isPurchased = window.isProductPurchased ? window.isProductPurchased(app.id) : false;
            let statusHtml = '', statusClass = '', priceHtml = '', installBtnHtml = '';

            if (app.restricted) {
                statusHtml = '🔒 مقيد';
                statusClass = 'restricted';
                installBtnHtml = `<button class="detail-install-btn" disabled>غير متاح</button>`;
            } else if (app.paymentRequired && !isPurchased) {
                statusHtml = '💰 يتطلب الدفع';
                statusClass = 'payment';
                const priceText = app.price > 0 ? `${app.price} ${appData.settings?.currency || 'ر.س'}` : 'مجاني';
                priceHtml = `<div class="detail-price">${priceText}</div>`;
                installBtnHtml =
                    `<button class="detail-install-btn payment-required" onclick="openPaymentModal('${app.id}')">💰 شراء التطبيق</button>`;
            } else {
                statusHtml = '✅ متاح';
                statusClass = '';
                priceHtml = app.price > 0 ? `<div class="detail-price">${app.price} ${appData.settings?.currency || 'ر.س'}</div>` :
                    '<div class="detail-price">مجاني</div>';
                installBtnHtml = `<button class="detail-install-btn" onclick="downloadDetailApp()">📥 تثبيت التطبيق</button>`;
            }

            const images = app.images || [app.image || 'https://placehold.co/400x300/e2e8f0/94a3b8?text=?'];
            const similarApps = [];
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const similar = appData.products[storeId].filter(p =>
                        p.id !== app.id && !p.restricted && (p.categoryId === app.categoryId || p.storeId === app.storeId)
                    );
                    similarApps.push(...similar);
                }
            }
            const topSimilar = similarApps.slice(0, 6);
            const reviews = appData.testimonials || [];

            const hashtagsHtml = window.renderHashtags ? window.renderHashtags(app.hashtags || []) : '';

            container.innerHTML = `
                <div class="app-detail-top">
                    <div class="detail-icon">${app.image ? `<img src="${app.image}" alt="${app.seo?.altText || app.name}" />` : `<i class="fas fa-mobile-alt"></i>`}</div>
                    <div class="detail-name">${app.name}</div>
                    <div class="detail-desc">${app.desc || 'لا يوجد وصف'}</div>
                    <div class="detail-status ${statusClass}">${statusHtml}</div>
                    ${priceHtml}
                    ${installBtnHtml}
                    ${hashtagsHtml}
                </div>
                <div class="app-detail-middle">
                    <div class="detail-images-scroll">${images.map(img => `<img src="${img}" alt="${app.name}" onerror="this.src='https://placehold.co/400x300/e2e8f0/94a3b8?text=?'" />`).join('')}</div>
                    <button class="detail-about-btn" onclick="alert('${app.desc || 'لمحة عن التطبيق: ' + app.name}')">📖 لمحة عن التطبيق</button>
                </div>
                <div class="app-detail-bottom">
                    <div class="share-section">
                        <span class="share-label">🔗 مشاركة التطبيق:</span>
                        <button class="share-btn" onclick="shareApp('${app.id}')"><i class="fas fa-share-alt"></i> مشاركة الرابط</button>
                        <button class="share-btn" style="background:#1DA1F2;" onclick="shareOnTwitter('${app.id}')"><i class="fab fa-twitter"></i></button>
                        <button class="share-btn" style="background:#25D366;" onclick="shareOnWhatsApp('${app.id}')"><i class="fab fa-whatsapp"></i></button>
                    </div>
                    <div class="rating-filter">
                        <button class="star-btn active" onclick="filterReviews(this, 0)">⭐ الكل</button>
                        <button class="star-btn" onclick="filterReviews(this, 4)">★★★★★</button>
                        <button class="star-btn" onclick="filterReviews(this, 3)">★★★★</button>
                        <button class="star-btn" onclick="filterReviews(this, 2)">★★★</button>
                    </div>
                    <div class="detail-reviews-scroll" id="detailReviewsScroll">
                        ${reviews.map(r => `
                            <div class="review-card" data-rating="${Math.floor(r.rating||0)}">
                                <div class="review-name">${r.name || 'مستخدم'}</div>
                                <div class="review-stars">${'★'.repeat(Math.floor(r.rating||0))}</div>
                                <div class="review-text">${r.review || ''}</div>
                            </div>
                        `).join('')}
                    </div>
                    ${topSimilar.length > 0 ? `
                        <div class="similar-apps-title">📱 تطبيقات مشابهة</div>
                        <div class="similar-apps-scroll">
                            ${topSimilar.map(sim => `
                                <div class="similar-card" onclick="closeAppDetail(); setTimeout(() => openAppDetail('${sim.id}'), 300);">
                                    <div class="sim-icon">${sim.image ? `<img src="${sim.image}" alt="${sim.name}" />` : `<i class="fas fa-mobile-alt"></i>`}</div>
                                    <div class="sim-name">${sim.name}</div>
                                    <div class="sim-rating">${sim.rating ? '★'.repeat(Math.floor(sim.rating)) : '☆'}</div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeAppDetail() {
            document.getElementById('appDetailOverlay').classList.remove('open');
            document.body.style.overflow = '';
            currentDetailAppId = null;
        }

        function filterReviews(btn, rating) {
            document.querySelectorAll('.rating-filter .star-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cards = document.querySelectorAll('#detailReviewsScroll .review-card');
            cards.forEach(card => {
                const cardRating = parseInt(card.dataset.rating) || 0;
                card.style.display = (rating === 0 || cardRating >= rating) ? '' : 'none';
            });
        }

        // ---- دوال المشاركة ----
        function shareApp(appId) {
            const link = window.getProductShareLink ? window.getProductShareLink(appId) :
                `${window.location.origin}${window.location.pathname}?product=${appId}`;
            if (navigator.share) {
                navigator.share({ title: 'تطبيق رائع', text: 'اكتشف هذا التطبيق المميز!', url: link }).catch(() => {});
            } else {
                navigator.clipboard.writeText(link).then(() => alert('✅ تم نسخ رابط التطبيق'))
                    .catch(() => prompt('انسخ الرابط:', link));
            }
        }

        function shareOnTwitter(appId) {
            const link = window.getProductShareLink ? window.getProductShareLink(appId) :
                `${window.location.origin}${window.location.pathname}?product=${appId}`;
            const text = 'اكتشف هذا التطبيق الرائع! 🚀';
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(link)}`,
            '_blank');
        }

        function shareOnWhatsApp(appId) {
            const link = window.getProductShareLink ? window.getProductShareLink(appId) :
                `${window.location.origin}${window.location.pathname}?product=${appId}`;
            const text = `اكتشف هذا التطبيق الرائع! 🚀 ${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function downloadDetailApp() {
            if (!currentDetailAppId) return;
            let app = null;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const found = appData.products[storeId].find(p => p.id === currentDetailAppId);
                    if (found) { app = found; break; }
                }
            }
            if (!app || app.restricted) { alert('هذا التطبيق غير متاح حالياً'); return; }
            const isPurchased = window.isProductPurchased ? window.isProductPurchased(app.id) : false;
            if (app.paymentRequired && !isPurchased) { openPaymentModal(app.id); return; }
            if (app.link && app.link !== '#') window.open(app.link, '_blank');
            else {
                alert(`جاري تحميل ${app.name} ... (محاكاة)`);
                app.downloadCount = (app.downloadCount || 0) + 1;
                saveDataAfterDownload();
            }
            closeAppDetail();
        }

        async function saveDataAfterDownload() {
            try { await window.saveAppData(appData, ['products']); } catch (e) { console.error(e); }
        }

        // ---- مودال التطبيق القديم ----
        function openAppModal(appId) {
            let app = null;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const found = appData.products[storeId].find(p => p.id === appId);
                    if (found) { app = found; break; }
                }
            }
            if (!app) return;
            currentAppId = appId;
            const modal = document.getElementById('appModal');
            document.getElementById('modalName').textContent = app.name;
            document.getElementById('modalDesc').textContent = app.desc || '';
            document.getElementById('modalMeta').textContent =
                `★ ${app.rating || '?'} · ${app.appSize || ''} · ⬇ ${app.downloadCount||0}`;
            const iconEl = document.getElementById('modalIcon');
            iconEl.innerHTML = app.image ? `<img src="${app.image}" alt="${app.name}" />` : `<i class="fas fa-mobile-alt"></i>`;
            const btn = document.getElementById('modalDownloadBtn');
            if (app.restricted) {
                btn.textContent = 'مقيد';
                btn.classList.add('disabled');
                btn.disabled = true;
            } else {
                btn.textContent = 'تثبيت';
                btn.classList.remove('disabled');
                btn.disabled = false;
            }
            modal.classList.add('open');
        }

        function closeAppModal() {
            document.getElementById('appModal').classList.remove('open');
            currentAppId = null;
        }

        function downloadApp() {
            if (!currentAppId) return;
            let app = null;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const found = appData.products[storeId].find(p => p.id === currentAppId);
                    if (found) { app = found; break; }
                }
            }
            if (!app || app.restricted) { alert('هذا التطبيق غير متاح حالياً'); return; }
            const isPurchased = window.isProductPurchased ? window.isProductPurchased(app.id) : false;
            if (app.paymentRequired && !isPurchased) { openPaymentModal(app.id); return; }
            if (app.link && app.link !== '#') window.open(app.link, '_blank');
            else {
                alert(`جاري تحميل ${app.name} ... (محاكاة)`);
                app.downloadCount = (app.downloadCount || 0) + 1;
                saveDataAfterDownload();
            }
            closeAppModal();
        }

        // ---- دالة عرض الإشعارات ----
        function showToast(message, type = 'success') {
            const old = document.querySelector('.toast-message');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast-message toast-${type}`;
            toast.textContent = message;
            toast.style.cssText =
                `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:40px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,0.3);z-index:9999;animation:slideUp 0.4s ease;color:white;direction:rtl;font-family:'Cairo',sans-serif;max-width:90%;text-align:center;background:${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#f59e0b'};`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(30px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ---- ربط الأحداث ----
        function setupEventListeners() {
            document.getElementById('appDetailOverlay')?.addEventListener('click', function(e) {
                if (e.target === this) closeAppDetail();
            });
            document.getElementById('paymentModal')?.addEventListener('click', function(e) {
                if (e.target === this) closePaymentModal();
            });
            document.getElementById('appModal')?.addEventListener('click', function(e) {
                if (e.target === this) closeAppModal();
            });
            document.getElementById('userModal')?.addEventListener('click', function(e) {
                if (e.target === this) closeUserModal();
            });
            document.getElementById('cartModal')?.addEventListener('click', function(e) {
                if (e.target === this) closeCartModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault();
                    openAdminLogin(); }
                if (e.key === 'Escape') {
                    if (document.getElementById('appDetailOverlay').classList.contains('open')) closeAppDetail();
                    else if (document.getElementById('paymentModal').classList.contains('open')) closePaymentModal();
                    else if (document.getElementById('userModal').classList.contains('open')) closeUserModal();
                    else if (document.getElementById('cartModal').classList.contains('open')) closeCartModal();
                    else if (document.getElementById('sideMenu').classList.contains('open')) closeSideMenu();
                    else closeAppModal();
                }
            });

            window.addEventListener('resize', () => {
                if (currentTab === 'home') { stopTestimonialsAutoScroll();
                    setTimeout(startTestimonialsAutoScroll, 300); }
            });
        }

        // ---- بدء التطبيق ----
        init();

        // تصدير الدوال للنطاق العام
        window.switchTab = switchTab;
        window.changeCarousel = changeCarousel;
        window.goToCarousel = goToCarousel;
        window.changeAppsCarousel = changeAppsCarousel;
        window.openAppDetail = openAppDetail;
        window.closeAppDetail = closeAppDetail;
        window.openPaymentModal = openPaymentModal;
        window.closePaymentModal = closePaymentModal;
        window.simulatePayment = simulatePayment;
        window.openAppModal = openAppModal;
        window.closeAppModal = closeAppModal;
        window.downloadApp = downloadApp;
        window.downloadDetailApp = downloadDetailApp;
        window.filterByCategory = filterByCategory;
        window.filterByStore = filterByStore;
        window.clearFilters = clearFilters;
        window.doSearch = doSearch;
        window.handleMarqueeClick = handleMarqueeClick;
        window.shareApp = shareApp;
        window.shareOnTwitter = shareOnTwitter;
        window.shareOnWhatsApp = shareOnWhatsApp;
        window.filterReviews = filterReviews;
        window.openSideMenu = openSideMenu;
        window.closeSideMenu = closeSideMenu;
        window.openUserModal = openUserModal;
        window.closeUserModal = closeUserModal;
        window.openCartModal = openCartModal;
        window.closeCartModal = closeCartModal;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
        window.sendOrderViaWhatsApp = sendOrderViaWhatsApp;
        window.sendOrderViaEmail = sendOrderViaEmail;
        window.sendOrderViaChat = sendOrderViaChat;
        window.showComingSoon = showComingSoon;
        window.scrollToBlog = scrollToBlog;
        window.openAdminLogin = openAdminLogin;
        window.handleUserAction = handleUserAction;
        window.switchUserMode = switchUserMode;
        window.shareArticle = shareArticle;
        window.switchTheme = switchTheme;
        window.showToast = showToast;

        console.log('🚀 Play Ramz - النسخة النهائية المتكاملة جاهزة!');
        console.log('© 2026 جميع الحقوق محفوظة للمهندس رمزي الصلاحي');
    </script>
</body>
</html>
