<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Play Ramz - متجر التطبيقات</title>

    <!-- ===== تحسينات السرعة ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://vpwqitvprtbwtgeuwjcs.supabase.co" />

    <!-- ===== الخطوط ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- ===== Font Awesome ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- ===== ملف الثيمات الموحد ===== -->
    <link rel="stylesheet" href="themes.css" />

    <style>
        /* ============================================================
           الأنماط الأساسية (تستخدم متغيرات CSS من themes.css)
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-body); color: var(--text-color); padding-bottom: 70px; direction: rtl; overflow-x: hidden; transition: background 0.4s ease, color 0.4s ease; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        /* ===== الهيدر ===== */
        .navbar { background: var(--nav-bg); padding: 12px 0; box-shadow: 0 2px 8px var(--shadow-color); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 1.5rem; font-weight: 800; color: var(--text-color); }
        .logo i { color: var(--primary-color); font-size: 1.8rem; }
        .logo .logo-text1 { color: var(--text-color); }
        .logo .logo-text2 { color: var(--primary-color); }
        .nav-actions { display: flex; gap: 12px; align-items: center; }
        .nav-actions img#logoImageHeader {
            height: 45px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease;
            background: transparent;
        }
        .nav-actions img#logoImageHeader:hover { transform: scale(1.05); }

        /* ===== كاروسيل ===== */
        .carousel-section { padding: 16px 0 8px; background: var(--bg-card); }
        .carousel-wrapper { position: relative; border-radius: var(--border-radius, 16px); overflow: hidden; box-shadow: 0 4px 12px var(--shadow-color); max-width: 100%; margin: 0 auto; }
        .carousel-slides { display: flex; transition: transform 0.4s ease; }
        .carousel-slide { min-width: 100%; height: 180px; background: var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-light); }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; font-size: 1.5rem; padding: 6px 12px; cursor: pointer; border-radius: 50%; z-index: 5; }
        .carousel-btn:hover { background: rgba(0,0,0,0.7); }
        .carousel-btn.prev { left: 8px; }
        .carousel-btn.next { right: 8px; }
        .carousel-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
        .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.6); border: none; cursor: pointer; padding: 0; }
        .carousel-dot.active { background: white; transform: scale(1.2); }

        /* ===== شريط إعلاني متحرك ===== */
        .marquee-section { background: var(--bg-card); padding: 8px 0; border-bottom: 1px solid var(--border-color); overflow: hidden; }
        .marquee-track { display: flex; gap: 20px; animation: marquee 20s linear infinite; width: max-content; }
        .marquee-item { display: flex; align-items: center; gap: 12px; background: var(--bg-card); padding: 4px 16px 4px 12px; border-radius: 30px; box-shadow: 0 2px 8px var(--shadow-color); white-space: nowrap; font-size: 0.85rem; border: 1px solid var(--border-color); }
        .marquee-item img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; background: var(--border-color); }
        .marquee-item .marquee-btn { background: var(--primary-color); color: white; border: none; padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* ===== الأقسام ===== */
        .section-block { margin: 20px 0; background: var(--bg-card); border-radius: var(--border-radius, 16px); padding: 12px 0 8px; box-shadow: 0 2px 8px var(--shadow-color); border: 1px solid var(--border-color); }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 8px; border-bottom: 1px solid var(--border-color); }
        .section-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-color); }
        .section-header a { color: var(--primary-color); font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        /* ===== الفئات ===== */
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 12px 16px; }
        .category-card { background: var(--bg-card); border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 1px 4px var(--shadow-color); border: 1px solid var(--border-color); transition: 0.2s; cursor: pointer; }
        .category-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow-hover); }
        .category-card i { font-size: 2rem; color: var(--primary-color); }
        .category-card .cat-name { font-weight: 600; margin-top: 4px; color: var(--text-color); }
        .category-card .cat-count { font-size: 0.7rem; color: var(--text-light); }

        /* ===== المطورين (صفين) ===== */
        .horizontal-scroll-2rows { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); gap: 14px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
        .horizontal-scroll-2rows::-webkit-scrollbar { display: none; }

        /* ===== التطبيقات (3 صفوف) ===== */
        .horizontal-scroll-3rows { display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, auto); gap: 14px; padding: 12px 8px 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; margin: 0 -8px 0 0; }
        .horizontal-scroll-3rows::-webkit-scrollbar { display: none; }
        .horizontal-scroll-3rows .card-horizontal { width: 380px; flex-shrink: 0; }
        .horizontal-scroll-3rows .card-horizontal:last-child { margin-left: 16px; }

        /* ===== آراء المستخدمين (صف واحد مع دوران تلقائي) ===== */
        .horizontal-scroll-1row { display: flex; flex-wrap: nowrap; gap: 14px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
        .horizontal-scroll-1row::-webkit-scrollbar { display: none; }

        /* ===== البطاقة الأفقية الموحدة ===== */
        .card-horizontal { background: var(--bg-card); border-radius: var(--border-radius, 16px); padding: 12px 14px; box-shadow: 0 2px 8px var(--shadow-color); border: 1px solid var(--border-color); transition: all 0.25s ease; cursor: pointer; display: flex; flex-direction: row; align-items: center; gap: 12px; flex-shrink: 0; width: 280px; }
        .card-horizontal:hover { transform: translateY(-4px); box-shadow: 0 8px 20px var(--shadow-hover); border-color: var(--primary-color); }
        .card-horizontal .card-icon { flex: 0 0 72px; width: 72px; height: 72px; border-radius: 16px; background: var(--border-color); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: var(--text-light); box-shadow: 0 2px 6px var(--shadow-color); flex-shrink: 0; }
        .card-horizontal .card-icon img { width: 100%; height: 100%; object-fit: cover; }
        .card-horizontal .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .card-horizontal .card-info .row1 { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); line-height: 1.3; }
        .card-horizontal .card-info .row2 { font-size: 0.8rem; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
        .card-horizontal .card-info .row2 .badge { background: var(--border-color); padding: 0 8px; border-radius: 12px; font-size: 0.65rem; color: var(--text-color); font-weight: 600; white-space: nowrap; }
        .card-horizontal .card-info .row3 { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text-light); flex-wrap: wrap; }
        .card-horizontal .card-info .row3 .rating-stars { color: #f59e0b; font-weight: 600; display: flex; align-items: center; gap: 2px; }
        .card-horizontal .card-info .row3 .action-btn { margin-right: auto; }
        .card-horizontal .card-info .row3 .action-btn button { background: var(--primary-color); color: white; border: none; padding: 4px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .card-horizontal .card-info .row3 .action-btn button:hover { opacity: 0.85; background: var(--primary-dark); }
        .card-horizontal .card-info .row3 .action-btn button.installed { background: var(--border-color); color: var(--text-color); }
        .card-horizontal .card-info .row3 .action-btn button:disabled { opacity: 0.5; cursor: not-allowed; }
        .card-horizontal .card-info .row3 .action-btn button.payment-required { background: #f59e0b; }
        .card-horizontal .card-info .row3 .action-btn button.payment-required:hover { background: #d97706; }

        /* ===== المدونة ===== */
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 12px 16px; }
        .blog-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px var(--shadow-color); border: 1px solid var(--border-color); transition: 0.2s; }
        .blog-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px var(--shadow-hover); }
        .blog-card img { width: 100%; height: 120px; object-fit: cover; }
        .blog-card .blog-body { padding: 10px; }
        .blog-card .blog-title { font-weight: 700; font-size: 1rem; color: var(--text-color); margin-bottom: 4px; }
        .blog-card .blog-excerpt { font-size: 0.85rem; color: var(--text-light); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .blog-card .blog-footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 0; border-top: 1px solid var(--border-color); margin-top: 8px; }
        .blog-card .blog-footer .share-btns { display: flex; gap: 6px; }
        .blog-card .blog-footer .share-btns button { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 0.9rem; transition: 0.2s; padding: 2px; }
        .blog-card .blog-footer .share-btns button:hover { color: var(--primary-color); }

        /* ===== صفحة التطبيقات ===== */
        #appsPage { display: none; padding: 0 0 20px 0; animation: fadeIn 0.3s ease; }
        #appsPage.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== شاشة تفاصيل التطبيق ===== */
        .app-detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; justify-content: center; align-items: center; padding: 16px; animation: fadeIn 0.3s ease; }
        .app-detail-overlay.open { display: flex; }
        .app-detail-container { background: var(--bg-card); border-radius: 28px; max-width: 500px; width: 100%; max-height: 95vh; overflow-y: auto; padding: 0; box-shadow: 0 30px 60px rgba(0,0,0,0.4); position: relative; scrollbar-width: none; -ms-overflow-style: none; }
        .app-detail-container::-webkit-scrollbar { display: none; }
        .app-detail-close { position: sticky; top: 12px; left: 16px; background: rgba(0,0,0,0.5); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10; float: left; margin: 12px 12px 0 0; backdrop-filter: blur(4px); transition: 0.2s; }
        .app-detail-close:hover { background: rgba(0,0,0,0.8); transform: scale(1.1); }

        .app-detail-top { padding: 20px 20px 16px; text-align: center; background: var(--gradient-primary); border-radius: 28px 28px 0 0; }
        .app-detail-top .detail-icon { width: 100px; height: 100px; border-radius: 24px; background: var(--border-color); overflow: hidden; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--text-light); box-shadow: 0 4px 16px var(--shadow-color); }
        .app-detail-top .detail-icon img { width: 100%; height: 100%; object-fit: cover; }
        .app-detail-top .detail-name { font-size: 1.4rem; font-weight: 800; color: var(--text-color); }
        .app-detail-top .detail-desc { font-size: 0.9rem; color: var(--text-light); margin: 4px 0 8px; }
        .app-detail-top .detail-status { display: inline-block; padding: 2px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: var(--primary-color); color: white; margin-bottom: 6px; }
        .app-detail-top .detail-status.restricted { background: #ef4444; }
        .app-detail-top .detail-status.payment { background: #f59e0b; }
        .app-detail-top .detail-price { font-size: 1.1rem; font-weight: 700; color: var(--text-color); margin: 4px 0 10px; }
        .app-detail-top .detail-price .old-price { text-decoration: line-through; color: var(--text-light); font-size: 0.9rem; margin-left: 8px; }
        .app-detail-top .detail-install-btn { background: var(--primary-color); color: white; border: none; padding: 12px 40px; border-radius: 40px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; max-width: 280px; margin: 0 auto; }
        .app-detail-top .detail-install-btn:hover { background: var(--primary-dark); }
        .app-detail-top .detail-install-btn:disabled { background: var(--border-color); color: var(--text-light); cursor: not-allowed; }
        .app-detail-top .detail-install-btn.payment-required { background: #f59e0b; }
        .app-detail-top .detail-install-btn.payment-required:hover { background: #d97706; }

        .app-detail-middle { padding: 16px 20px; background: var(--bg-body); }
        .app-detail-middle .detail-images-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .app-detail-middle .detail-images-scroll::-webkit-scrollbar { display: none; }
        .app-detail-middle .detail-images-scroll img { flex: 0 0 auto; width: 130px; height: 90px; border-radius: 12px; object-fit: cover; background: var(--border-color); border: 2px solid var(--bg-card); box-shadow: 0 2px 8px var(--shadow-color); }
        .app-detail-middle .detail-about-btn { display: block; width: 100%; padding: 10px; border: 2px solid var(--border-color); border-radius: 40px; background: var(--bg-card); font-weight: 600; color: var(--text-color); cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 0.9rem; margin-top: 4px; }
        .app-detail-middle .detail-about-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }

        .app-detail-bottom { padding: 16px 20px 20px; }
        .app-detail-bottom .share-section { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .app-detail-bottom .share-section .share-label { font-weight: 600; font-size: 0.9rem; color: var(--text-color); }
        .app-detail-bottom .share-section .share-btn { background: var(--primary-color); color: white; border: none; padding: 6px 18px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .app-detail-bottom .share-section .share-btn:hover { background: var(--primary-dark); }
        .app-detail-bottom .rating-filter { display: flex; gap: 8px; margin: 10px 0 14px; flex-wrap: wrap; }
        .app-detail-bottom .rating-filter .star-btn { background: var(--border-color); border: 2px solid transparent; padding: 4px 14px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit; color: var(--text-color); }
        .app-detail-bottom .rating-filter .star-btn:hover { background: var(--shadow-color); }
        .app-detail-bottom .rating-filter .star-btn.active { background: #f59e0b; color: white; border-color: #f59e0b; }

        .app-detail-bottom .detail-reviews-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .app-detail-bottom .detail-reviews-scroll::-webkit-scrollbar { display: none; }
        .app-detail-bottom .detail-reviews-scroll .review-card { flex: 0 0 auto; width: 200px; background: var(--bg-card); border-radius: 16px; padding: 12px; text-align: center; border: 1px solid var(--border-color); }
        .app-detail-bottom .detail-reviews-scroll .review-card .review-name { font-weight: 600; font-size: 0.85rem; color: var(--text-color); }
        .app-detail-bottom .detail-reviews-scroll .review-card .review-stars { color: #f59e0b; font-size: 0.75rem; }
        .app-detail-bottom .detail-reviews-scroll .review-card .review-text { font-size: 0.75rem; color: var(--text-light); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .app-detail-bottom .similar-apps-title { font-weight: 700; font-size: 1rem; margin: 14px 0 8px; color: var(--text-color); }
        .app-detail-bottom .similar-apps-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; -ms-overflow-style: none; }
        .app-detail-bottom .similar-apps-scroll::-webkit-scrollbar { display: none; }
        .app-detail-bottom .similar-apps-scroll .similar-card { flex: 0 0 auto; width: 140px; background: var(--bg-card); border-radius: 16px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid var(--border-color); }
        .app-detail-bottom .similar-apps-scroll .similar-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow-hover); }
        .app-detail-bottom .similar-apps-scroll .similar-card .sim-icon { width: 56px; height: 56px; border-radius: 14px; background: var(--border-color); margin: 0 auto 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--text-light); }
        .app-detail-bottom .similar-apps-scroll .similar-card .sim-icon img { width: 100%; height: 100%; object-fit: cover; }
        .app-detail-bottom .similar-apps-scroll .similar-card .sim-name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); }
        .app-detail-bottom .similar-apps-scroll .similar-card .sim-rating { font-size: 0.65rem; color: #f59e0b; }

        /* ===== القائمة الجانبية ===== */
        .side-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 800; animation: fadeIn 0.25s ease; }
        .side-menu-overlay.open { display: block; }
        .side-menu { position: fixed; top: 0; left: 0; width: 320px; max-width: 85vw; height: 100%; background: var(--secondary-color); z-index: 900; transform: translateX(-110%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; padding: 20px 16px 30px; box-shadow: 4px 0 30px rgba(0,0,0,0.3); scrollbar-width: thin; scrollbar-color: var(--primary-color) transparent; }
        .side-menu::-webkit-scrollbar { width: 4px; }
        .side-menu::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }
        .side-menu.open { transform: translateX(0); }
        .side-menu .menu-logo { text-align: center; padding: 10px 0 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        .side-menu .menu-logo img { max-width: 120px; max-height: 80px; object-fit: contain; border-radius: 12px; }
        .side-menu .menu-logo .logo-text { color: white; font-size: 1.3rem; font-weight: 800; margin-top: 4px; }
        .side-menu .menu-logo .logo-text .logo-text1 { color: white; }
        .side-menu .menu-logo .logo-text .logo-text2 { color: var(--primary-color); }
        .side-menu .menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; color: var(--text-light); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; border: none; background: none; width: 100%; text-align: right; font-family: inherit; }
        .side-menu .menu-item:hover { background: var(--bg-card); color: white; }
        .side-menu .menu-item i { font-size: 1.3rem; width: 28px; text-align: center; color: var(--primary-color); }
        .side-menu .menu-item .item-badge { background: var(--primary-color); color: white; font-size: 0.6rem; padding: 1px 10px; border-radius: 20px; margin-right: auto; font-weight: 700; }
        .side-menu .menu-item .item-badge.coming { background: #f59e0b; }
        .side-menu .menu-divider { height: 1px; background: var(--border-color); margin: 12px 0; }
        .side-menu .menu-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-light); font-size: 0.7rem; }

        /* ===== مودال المستخدم ===== */
        .user-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 700; justify-content: center; align-items: center; padding: 20px; }
        .user-modal.open { display: flex; }
        .user-modal-content { background: var(--bg-card); border-radius: 28px; max-width: 400px; width: 100%; padding: 30px 24px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
        .user-modal-content h3 { font-size: 1.3rem; color: var(--text-color); margin-bottom: 4px; }
        .user-modal-content .user-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--border-color); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--text-light); }

    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
            <i class="fas fa-house"></i><span class="nav-label">الرئيسية</span>
        </button>
        <button class="nav-item" data-tab="apps" onclick="switchTab('apps')">
            <i class="fas fa-th-large"></i><span class="nav-label">التطبيقات</span>
        </button>
        <button class="nav-item" data-tab="stores" onclick="switchTab('stores')">
            <i class="fas fa-store"></i><span class="nav-label">المطورين</span>
        </button>
        <button class="nav-item" data-tab="search" onclick="switchTab('search')">
            <i class="fas fa-search"></i><span class="nav-label">بحث</span>
        </button>

            <i class="fas fa-bars"></i><span class="nav-label">القائمة</span>

    <!-- ===== تحميل common.js ===== -->
    <script src="common.js"></script>

    <!-- ===== كود التشغيل الرئيسي ===== -->
    <script>
        // ============================================================
        // كود index.html – النسخة النهائية
        // ============================================================

        let appData = {};
        let currentTab = 'home';
        let currentFilterCategory = 'all';
        let currentFilterStore = 'all';
        let carouselIndex = 0;
        let carouselTimer = null;
        let currentAppId = null;
        let currentDetailAppId = null;
        let pendingPaymentAppId = null;
        let isUserLoggedIn = false;
        let currentUser = null;
        let userMode = 'login';

        // متغيرات للتحكم في دوران آراء المستخدمين
        let testimonialsInterval = null;
        let testimonialsScrollContainer = null;
        let testimonialsAutoScroll = true;

        // ---- تحميل البيانات وعرض الموقع ----
        async function init() {
            appData = await window.loadAppData();
            
            // تطبيق الثيم المحفوظ
            applyTheme();
            
            // زيادة عداد الزوار
            if (!sessionStorage.getItem('visitorCounted')) {
                if (window.incrementVisitorCount) window.incrementVisitorCount();
                sessionStorage.setItem('visitorCounted', 'true');
            }
            
            loadUserState();
            renderAll();
            setupEventListeners();
            
            // تحديث SEO
            updateSEO();
            
            // تحميل الإعلانات
            loadAds();
            
            setInterval(async () => {
                const fresh = await window.loadAppData();
                if (JSON.stringify(fresh) !== JSON.stringify(appData)) {
                    appData = fresh;
                    renderAll();
                }
            }, 60000);
        }

        function renderAll() {
            renderLogo();
            renderCarousel();
            renderMarquee();
            renderFooter();
            renderSideMenu();
            updateCartBadge();
            switchTab(currentTab);
        }

        // ============================================================
        // الثيمات
        // ============================================================
        function applyTheme() {
            const theme = appData.settings?.activeTheme || 'theme-default';
            document.body.className = theme;
            updateThemeBadge(theme);
        }

        function switchTheme() {
            const themes = ['theme-default', 'theme-dark', 'theme-blue', 'theme-purple', 'theme-red', 'theme-gold'];
            const current = document.body.className || 'theme-default';
            let index = themes.indexOf(current);
            index = (index + 1) % themes.length;
            const newTheme = themes[index];
            document.body.className = newTheme;
            if (appData.settings) {
                appData.settings.activeTheme = newTheme;
                window.saveAppData(appData, ['settings']);
            }
            updateThemeBadge(newTheme);
            showToast('🎨 تم التبديل إلى ' + newTheme.replace('theme-', ''), 'success');
        }

        function updateThemeBadge(theme) {
            const badge = document.getElementById('themeBadge');
            if (!badge) return;
            const icons = {
                'theme-default': '🌿',
                'theme-dark': '🌙',
                'theme-blue': '🔵',
                'theme-purple': '🟣',
                'theme-red': '🔴',
                'theme-gold': '🟡'
            };
            badge.textContent = icons[theme] || '🌿';
        }

        // ============================================================
        // SEO
        // ============================================================
        function updateSEO() {
            if (window.updatePageSEO) {
                const data = getCurrentPageData();
                window.updatePageSEO(data);
            }
        }

        function getCurrentPageData() {
            // يمكن توسيع هذه الدالة لجلب بيانات الصفحة الحالية
            return null;
        }

        // ============================================================
        // الإعلانات
        // ============================================================
        function loadAds() {
            const ads = appData.settings?.ads || {};
            if (ads.googleAdSense?.publisherId) {
                window.loadGoogleAdSense(ads.googleAdSense.publisherId);
            }
        }

        // ============================================================
        // الدوال الأساسية
        // ============================================================
        function renderLogo() {
            const s = appData.settings || {};
            const el = document.getElementById('logoDisplay');
            const logoImg = document.getElementById('logoImageHeader');
            const imageUrl = s.logoImage || '';

            if (el) {
                const icon = s.logoIcon || 'fa-gamepad';
                const text1 = s.logoText1 || 'Play';
                const text2 = s.logoText2 || 'Ramz';
                const color2 = s.logoText2Color || '#4CAF50';
                el.innerHTML = `
                    <i class="fas ${icon}"></i>
                    <span class="logo-text1">${text1}</span>
                    <span class="logo-text2" style="color:${color2};">${text2}</span>
                `;
            }

            if (logoImg) {
                if (imageUrl && imageUrl.trim() !== '') {
                    logoImg.src = imageUrl;
                    logoImg.style.display = 'block';
                    if (el) el.style.display = 'none';
                } else {
                    logoImg.style.display = 'none';
                    logoImg.src = '';
                    if (el) el.style.display = 'flex';
                }
            }

            // تحديث القائمة الجانبية
            const menuLogoText = document.getElementById('menuLogoText');
            if (menuLogoText) {
                const text1 = s.logoText1 || 'Play';
                const text2 = s.logoText2 || 'Ramz';
                const color2 = s.logoText2Color || '#4CAF50';
                menuLogoText.innerHTML = `
                    <span class="logo-text1">${text1}</span>
                    <span class="logo-text2" style="color:${color2};">${text2}</span>
                `;
            }

            const menuLogoImg = document.getElementById('menuLogoImage');
            if (menuLogoImg) {
                if (imageUrl && imageUrl.trim() !== '') {
                    menuLogoImg.src = imageUrl;
                    menuLogoImg.style.display = 'block';
                } else {
                    menuLogoImg.style.display = 'none';
                }
            }

            document.title = (s.appName || 'Play Ramz') + ' - متجر التطبيقات';
        }

        function renderCarousel() {
            const container = document.getElementById('carouselSlides');
            const dots = document.getElementById('carouselDots');
            const slides = appData.carousel || [];
            if (slides.length === 0) {
                container.innerHTML = `<div class="carousel-slide"><span style="color:var(--text-light);">لا توجد إعلانات</span></div>`;
                dots.innerHTML = '';
                return;
            }
            const sorted = [...slides].sort((a, b) => (a.order || 0) - (b.order || 0));
            container.innerHTML = sorted.map((slide) =>
                `<div class="carousel-slide"><img src="${slide.image}" alt="${slide.seo?.altText || slide.name || 'إعلان'}" loading="lazy" /></div>`
            ).join('');
            dots.innerHTML = sorted.map((_, i) =>
                `<button class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="goToCarousel(${i})"></button>`
            ).join('');
            carouselIndex = 0;
            updateCarousel();
            startCarouselTimer();
        }

        function updateCarousel() {
            const total = appData.carousel ? appData.carousel.length : 0;
            if (total === 0) return;
            if (carouselIndex >= total) carouselIndex = 0;
            if (carouselIndex < 0) carouselIndex = total - 1;
            const container = document.getElementById('carouselSlides');
            container.style.transform = `translateX(-${carouselIndex * 100}%)`;
            document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === carouselIndex);
            });
        }

        function changeCarousel(dir) {
            const total = appData.carousel ? appData.carousel.length : 0;
            if (total === 0) return;
            carouselIndex += dir;
            if (carouselIndex >= total) carouselIndex = 0;
            if (carouselIndex < 0) carouselIndex = total - 1;
            updateCarousel();
            resetCarouselTimer();
        }

        function goToCarousel(idx) {
            const total = appData.carousel ? appData.carousel.length : 0;
            if (idx < 0 || idx >= total) return;
            carouselIndex = idx;
            updateCarousel();
            resetCarouselTimer();
        }

        function startCarouselTimer() {
            if (carouselTimer) clearInterval(carouselTimer);
            carouselTimer = setInterval(() => changeCarousel(1), 4000);
        }

        function resetCarouselTimer() {
            if (carouselTimer) clearInterval(carouselTimer);
            startCarouselTimer();
        }

        function renderMarquee() {
            const track = document.getElementById('marqueeTrack');
            const items = appData.marquee || [];
            if (items.length === 0) {
                track.innerHTML = '<span style="color:var(--text-light);padding:4px 0;">أضف إعلانات من لوحة التحكم</span>';
                return;
            }
            const doubled = [...items, ...items];
            track.innerHTML = doubled.map((item) => `
                <div class="marquee-item">
                    <img src="${item.icon || 'https://placehold.co/64/e2e8f0/94a3b8?text=?'}" alt="${item.name}" />
                    <span>${item.name}</span>
                    <button class="marquee-btn" onclick="event.stopPropagation();handleMarqueeClick('${item.link}')">تحميل</button>
                </div>
            `).join('');
        }

        function handleMarqueeClick(link) {
            if (link && link !== '#') window.open(link, '_blank');
            else alert('رابط التحميل غير متاح حالياً');
        }

        function renderFooter() {
            const container = document.getElementById('footerContent');
            const f = appData.footer || {};
            const s = appData.settings || {};
            const links = f.links || {};
            const linkKeys = ['policy', 'terms', 'about', 'contact', 'blog'];
            const linkLabels = { 'policy': 'سياسة الخصوصية', 'terms': 'الشروط والأحكام', 'about': 'من نحن', 'contact': 'اتصل بنا', 'blog': 'المدونة' };
            let linkHtml = '';
            linkKeys.forEach(key => {
                const item = links[key] || { text: linkLabels[key], external_url: '', use_file: false };
                const url = item.use_file ? `${key}.html` : (item.external_url || '#');
                linkHtml += `<li><a href="${url}">${item.text}</a></li>`;
            });

            const social = f.socialMedia || [];
            const socialIcons = {
                'whatsapp': 'fab fa-whatsapp', 'facebook': 'fab fa-facebook-f', 'twitter': 'fab fa-twitter',
                'instagram': 'fab fa-instagram', 'telegram': 'fab fa-telegram-plane', 'snapchat': 'fab fa-snapchat-ghost',
                'linkedin': 'fab fa-linkedin-in', 'tiktok': 'fab fa-tiktok'
            };
            let socialHtml = '';
            social.forEach(item => {
                if (item.active && item.url) {
                    const icon = socialIcons[item.platform] || 'fas fa-link';
                    socialHtml += `<a href="${item.url}" target="_blank"><i class="${icon}"></i></a>`;
                }
            });

            container.innerHTML = `
                <div><h4>روابط سريعة</h4><ul>${linkHtml}</ul></div>
                <div>
                    <h4>تواصل معنا</h4>
                    <ul>
                        ${f.email ? `<li><i class="fas fa-envelope"></i> <a href="mailto:${f.email}">${f.email}</a></li>` : ''}
                        ${f.phone ? `<li><i class="fas fa-phone"></i> <a href="tel:${f.phone}">${f.phone}</a></li>` : ''}
                        ${f.whatsapp ? `<li><i class="fab fa-whatsapp"></i> <a href="https://wa.me/${f.whatsapp}" target="_blank">واتساب</a></li>` : ''}
                    </ul>
                    <div class="social-icons">${socialHtml}</div>
                </div>
                <div>
                    <h4>طرق الدفع</h4>
                    <ul>${(f.payments || []).map(p => `<li>${p}</li>`).join('')}</ul>
                </div>
                <div class="copyright">${s.footerText || '© 2026 Play Ramz – جميع الحقوق محفوظة للمهندس رمزي الصلاحي'}</div>
            `;
        }

        function renderSideMenu() {
            const s = appData.settings || {};
            const menuSettings = s.menuSettings || { enableUserIcon: true, enableCartIcon: true };
            const userBtn = document.getElementById('menuUserBtn');
            if (menuSettings.enableUserIcon !== false) {
                userBtn.style.display = 'flex';
                const badge = document.getElementById('userStatusBadge');
                if (isUserLoggedIn && currentUser) badge.textContent = currentUser.name || 'مرحباً';
                else badge.textContent = 'تسجيل الدخول';
            } else userBtn.style.display = 'none';

            const cartBtn = document.getElementById('menuCartBtn');
            if (menuSettings.enableCartIcon !== false) cartBtn.style.display = 'flex';
            else cartBtn.style.display = 'none';

            updateCartBadge();
        }

        // ---- دوال المستخدم ----
        function loadUserState() {
            try {
                const saved = localStorage.getItem('ramzplay_user');
                if (saved) {
                    const data = JSON.parse(saved);
                    isUserLoggedIn = data.loggedIn || false;
                    currentUser = data.user || null;
                }
            } catch (e) {}
        }

        function saveUserState() {
            try {
                localStorage.setItem('ramzplay_user', JSON.stringify({ loggedIn: isUserLoggedIn, user: currentUser }));
            } catch (e) {}
        }

        function openUserModal() {
            if (isUserLoggedIn && currentUser) {
                alert(`👤 مرحباً ${currentUser.name || 'مستخدم'}!\n📧 ${currentUser.email || 'لا يوجد بريد'}`);
                return;
            }
            userMode = 'login';
            document.getElementById('userModalTitle').textContent = 'تسجيل الدخول';
            document.getElementById('userModalSub').textContent = 'أدخل بياناتك للدخول إلى حسابك';
            document.getElementById('userActionBtn').textContent = 'تسجيل الدخول';
            document.getElementById('userSwitchBtn').textContent = 'إنشاء حساب جديد';
            document.getElementById('userStatusMsg').textContent = '';
            document.getElementById('userNameInput').value = '';
            document.getElementById('userPassInput').value = '';
            document.getElementById('userModal').classList.add('open');
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.remove('open');
        }

        function switchUserMode() {
            if (userMode === 'login') {
                userMode = 'register';
                document.getElementById('userModalTitle').textContent = 'إنشاء حساب جديد';
                document.getElementById('userModalSub').textContent = 'أدخل بياناتك لإنشاء حساب جديد';
                document.getElementById('userActionBtn').textContent = 'إنشاء حساب';
                document.getElementById('userSwitchBtn').textContent = 'لديك حساب؟ تسجيل الدخول';
            } else {
                userMode = 'login';
                document.getElementById('userModalTitle').textContent = 'تسجيل الدخول';
                document.getElementById('userModalSub').textContent = 'أدخل بياناتك للدخول إلى حسابك';
                document.getElementById('userActionBtn').textContent = 'تسجيل الدخول';
                document.getElementById('userSwitchBtn').textContent = 'إنشاء حساب جديد';
            }
            document.getElementById('userStatusMsg').textContent = '';
        }

        function handleUserAction() {
            const name = document.getElementById('userNameInput').value.trim();
            const pass = document.getElementById('userPassInput').value.trim();
            const msg = document.getElementById('userStatusMsg');

            if (!name || !pass) {
                msg.textContent = '⚠️ يرجى ملء جميع الحقول';
                msg.style.color = '#ef4444';
                return;
            }

            if (userMode === 'register') {
                const users = JSON.parse(localStorage.getItem('ramzplay_users') || '[]');
                if (users.find(u => u.name === name)) {
                    msg.textContent = '⚠️ هذا الاسم مستخدم بالفعل';
                    msg.style.color = '#ef4444';
                    return;
                }
                users.push({ name, password: pass, email: '', createdAt: new Date().toISOString() });
                localStorage.setItem('ramzplay_users', JSON.stringify(users));
                isUserLoggedIn = true;
                currentUser = { name, email: '' };
                saveUserState();
                renderSideMenu();
                closeUserModal();
                alert('✅ تم إنشاء الحساب بنجاح!');
            } else {
                const users = JSON.parse(localStorage.getItem('ramzplay_users') || '[]');
                const found = users.find(u => u.name === name && u.password === pass);
                if (found) {
                    isUserLoggedIn = true;
                    currentUser = { name: found.name, email: found.email || '' };
                    saveUserState();
                    renderSideMenu();
                    closeUserModal();
                    alert('✅ مرحباً ' + name + '!');
                } else {
                    msg.textContent = '⚠️ اسم المستخدم أو كلمة المرور غير صحيحة';
                    msg.style.color = '#ef4444';
                }
            }
        }

        // ---- دوال السلة ----
        function getCartItems() {
            try { return JSON.parse(localStorage.getItem('ramzplay_cart') || '[]'); } catch { return []; }
        }

        function saveCartItems(items) {
            localStorage.setItem('ramzplay_cart', JSON.stringify(items));
            updateCartBadge();
        }

        function addToCart(appId) {
            let app = null;
            for (const storeId in appData.products) {
                if (appData.products[storeId]) {
                    const found = appData.products[storeId].find(p => p.id === appId);
                    if (found) { app = found; break; }
                }
            }
            if (!app || app.restricted) return;
            const cart = getCartItems();
            if (cart.find(item => item.id === appId)) {
                alert('⚠️ هذا التطبيق موجود بالفعل في السلة');
                return;
            }
            cart.push({
                id: app.id,
                name: app.name,
                image: app.image || '',
                price: app.paymentRequired ? (app.price || 0) : 0,
                currency: appData.settings?.currency || 'ر.س'
            });
            saveCartItems(cart);
            alert('✅ تم إضافة ' + app.name + ' إلى السلة');
        }

        function removeFromCart(appId) {
            let cart = getCartItems();
            cart = cart.filter(item => item.id !== appId);
            saveCartItems(cart);
            renderCartModal();
        }

        function updateCartBadge() {
            const cart = getCartItems();
            const badge = document.getElementById('cartCountBadge');
            if (badge) {
                badge.textContent = cart.length;
                badge.style.display = cart.length > 0 ? 'inline' : 'none';
            }
        }

        function openCartModal() {
            renderCartModal();
            document.getElementById('cartModal').classList.add('open');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.remove('open');
        }

        function renderCartModal() {
            const container = document.getElementById('cartItemsContainer');
            const totalEl = document.getElementById('cartTotal');
            const cart = getCartItems();
            if (cart.length === 0) {
                container.innerHTML = '<div class="cart-empty">🛒 السلة فارغة</div>';
                totalEl.textContent = 'المجموع: 0.00 ر.س';
                return;
            }
            let total = 0;
            let html = '';
            cart.forEach(item => {
                total += item.price || 0;
                html += `
                    <div class="cart-item">
                        <div class="ci-icon">${item.image ? `<img src="${item.image}" alt="${item.name}" />` : `<i class="fas fa-mobile-alt"></i>`}</div>
                        <div class="ci-info">
                            <div class="ci-name">${item.name}</div>
                            <div class="ci-price">${item.price > 0 ? item.price + ' ' + item.currency : 'مجاني'}</div>
                        </div>
                        <button class="ci-remove" onclick="removeFromCart('${item.id}')"><i class="fas fa-times"></i></button>
                    </div>
                `;
            });
            container.innerHTML = html;
            const currency = appData.settings?.currency || 'ر.س';
            totalEl.textContent = `المجموع: ${total.toFixed(2)} ${currency}`;
        }

        function sendOrderViaWhatsApp() {
            const cart = getCartItems();
            if (cart.length === 0) { alert('السلة فارغة'); return; }
            const menuSettings = appData.settings?.menuSettings || {};
            const phone = menuSettings.whatsappOrders || '966500000000';
            let msg = '🛒 طلب جديد:\n';
            let total = 0;
            cart.forEach(item => {
                msg += `- ${item.name} (${item.price > 0 ? item.price + ' ' + (item.currency || 'ر.س') : 'مجاني'})\n`;
                total += item.price || 0;
            });
            msg += `\nالمجموع: ${total.toFixed(2)} ${appData.settings?.currency || 'ر.س'}`;
            window.open(`https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendOrderViaEmail() {
            const cart = getCartItems();
            if (cart.length === 0) { alert('السلة فارغة'); return; }
            const menuSettings = appData.settings?.menuSettings || {};
            const email = menuSettings.emailOrders || 'orders@ramzplay.com';
            let subject = 'طلب جديد من متجر Ramzplay';
            let body = '🛒 طلب جديد:\n';
            let total = 0;
            cart.forEach(item => {
                body += `- ${item.name} (${item.price > 0 ? item.price + ' ' + (item.currency || 'ر.س') : 'مجاني'})\n`;
                total += item.price || 0;
            });
            body += `\nالمجموع: ${total.toFixed(2)} ${appData.settings?.currency || 'ر.س'}`;
            window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        function sendOrderViaChat() {
            const cart = getCartItems();
            if (cart.length === 0) { alert('السلة فارغة'); return; }
            const menuSettings = appData.settings?.menuSettings || {};
            const email = menuSettings.emailOrders || 'admin@ramzplay.com';
            let subject = 'طلب محادثة حول طلب جديد';
            let body = 'مرحباً، أرغب في الاستفسار عن طلبي التالي:\n\n';
            let total = 0;
            cart.forEach(item => {
                body += `- ${item.name} (${item.price > 0 ? item.price + ' ' + (item.currency || 'ر.س') : 'مجاني'})\n`;
                total += item.price || 0;
            });
            body += `\nالمجموع: ${total.toFixed(2)} ${appData.settings?.currency || 'ر.س'}`;
            body += '\n\nيرجى التواصل معي لتأكيد الطلب. شكراً!';
            window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            alert('📨 سيتم فتح محادثة مع المدير عبر البريد الإلكتروني.\n\n' + body);
        }

        // ---- دوال "قريباً" ----
        function showComingSoon(name) {
            alert(`⏳ "${name}" قريباً! سيتم إضافة هذه الميزة في التحديثات القادمة.`);
        }

        // ---- التنقل إلى المدونة ----
        function scrollToBlog() {
            closeSideMenu();
            const blogSection = document.querySelector('.blog-grid');
            if (blogSection) blogSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            else {
                switchTab('home');
                setTimeout(() => {
                    const blogSection2 = document.querySelector('.blog-grid');
                    if (blogSection2) blogSection2.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }
        }

        // ---- فتح لوحة التحكم ----
        function openAdminLogin() {
            closeSideMenu();
            window.location.href = 'admin.html';
        }

        // ---- دوال القائمة الجانبية ----
        function openSideMenu() {
            document.getElementById('sideMenuOverlay').classList.add('open');
            document.getElementById('sideMenu').classList.add('open');

        // ---- التبويبات ----
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            if (tab !== 'home') stopTestimonialsAutoScroll();
            const main = document.getElementById('mainContent');
            const appsPage = document.getElementById('appsPage');
            const carouselSec = document.getElementById('carouselSection');
            const marqueeSec = document.getElementById('marqueeSection');
            const footerSec = document.getElementById('footerSection');

            if (tab === 'home') {
                main.style.display = '';
                appsPage.style.display = 'none';
                appsPage.classList.remove('active');
                carouselSec.style.display = '';
                marqueeSec.style.display = '';
                footerSec.style.display = '';
                renderHome(main);
                setTimeout(startTestimonialsAutoScroll, 300);
            } else if (tab === 'apps') {
                main.style.display = 'none';
                appsPage.style.display = 'block';

                carouselSec.style.display = 'none';
                marqueeSec.style.display = 'none';

                carouselSec.style.display = 'none';
                marqueeSec.style.display = 'none';
                footerSec.style.display = '';
                renderStoresPage(main);
            } else if (tab === 'search') {
                main.style.display = '';
                appsPage.style.display = 'none';
                appsPage.classList.remove('active');
                carouselSec.style.display = 'none';
                marqueeSec.style.display = 'none';
                footerSec.style.display = '';
                renderSearchPage(main);

                appsPage.style.display = 'none';

        function testimonialCardHtml(t) {
            const stars = '★'.repeat(Math.floor(t.rating || 0)) + (t.rating % 1 >= 0.5 ? '½' : '');
            return `
                <div class="testimonial-card">
                    <img src="${t.image || 'https://placehold.co/100/e2e8f0/94a3b8?text=?'}" alt="${t.name}" />
                    <div class="t-name">${t.name}</div>
                    <div class="t-rating">${stars}</div>
                    <div class="t-review">${t.review || ''}</div>
                </div>
            `;
        }

        function appCardHtml(app) {
            const category = appData.categories.find(c => c.id === app.categoryId);
            const categoryName = category ? category.name : '';
            const ratingStars = app.rating ? '★ '.repeat(Math.floor(app.rating)) + (app.rating % 1 >= 0.5 ? '½' : '') : '';
            let downloadsText = '';
            if (app.downloadCount) {
                const count = app.downloadCount;
                if (count >= 1000000) downloadsText = (count / 1000000).toFixed(1) + 'M';
                else if (count >= 1000) downloadsText = (count / 1000).toFixed(1) + 'K';
                else downloadsText = count.toString();
            }

            const isPurchased = window.isProductPurchased ? window.isProductPurchased(app.id) : false;
            let actionHtml = '';
            if (app.restricted) actionHtml = `<button disabled>مقيد</button>`;
            else if (app.paymentRequired && !isPurchased) {
                const priceText = app.price > 0 ? `${app.price} ${appData.settings?.currency || 'ر.س'}` : 'مجاني';
                actionHtml = `<button class="payment-required" onclick="event.stopPropagation();openPaymentModal('${app.id}')">💰 ${priceText}</button>`;
            } else actionHtml = `<button onclick="event.stopPropagation();openAppDetail('${app.id}')">تثبيت</button>`;

            const hashtagsHtml = window.renderHashtags ? window.renderHashtags(app.hashtags || []) : '';

            return `
                <div class="card-horizontal" onclick="openAppDetail('${app.id}')">
                    <div class="card-icon">${app.image ? `<img src="${app.image}" alt="${app.seo?.altText || app.name}" />` : `<i class="fas fa-mobile-alt"></i>`}</div>
                    <div class="card-info">
                        <div class="row1">${app.name}</div>
                        <div class="row2">${categoryName ? `<span class="badge">${categoryName}</span>` : ''}<span>${app.desc || ''}</span></div>
                        <div class="row3">
                            <span class="rating-stars">${ratingStars || '☆'}</span>
                            <span><i class="fas fa-download"></i> ${downloadsText || app.downloadCount || 0}</span>
                            <div class="action-btn">${actionHtml}</div>
                        </div>
                        ${hashtagsHtml}
                    </div>
                </div>
            `;
        }

        // ============================================================
        // دوال دوران آراء المستخدمين
        // ============================================================
        function setupTestimonialsScroll() {
            testimonialsScrollContainer = document.getElementById('testimonialsScroll');
            if (!testimonialsScrollContainer) return;
            testimonialsScrollContainer.addEventListener('touchstart', () => {
                testimonialsAutoScroll = false;
                stopTestimonialsAutoScroll();
            });
            testimonialsScrollContainer.addEventListener('touchend', () => {
                setTimeout(() => {
                    if (!testimonialsAutoScroll) {
                        testimonialsAutoScroll = true;
                        startTestimonialsAutoScroll();
                    }
                }, 3000);
            });
            testimonialsScrollContainer.addEventListener('mousedown', () => {
                testimonialsAutoScroll = false;
                stopTestimonialsAutoScroll();
            });
            testimonialsScrollContainer.addEventListener('mouseup', () => {
                setTimeout(() => {
                    if (!testimonialsAutoScroll) {
                        testimonialsAutoScroll = true;
                        startTestimonialsAutoScroll();
                    }
                }, 3000);
            });
        }

        function startTestimonialsAutoScroll() {
            if (!testimonialsScrollContainer) return;
            if (testimonialsInterval) clearInterval(testimonialsInterval);
            const cards = testimonialsScrollContainer.querySelectorAll('.testimonial-card');
            if (cards.length === 0) return;
            const cardWidth = cards[0].offsetWidth + 16;
            testimonialsInterval = setInterval(() => {
                if (!testimonialsAutoScroll) return;
                const currentScroll = testimonialsScrollContainer.scrollLeft;
                const maxScroll = testimonialsScrollContainer.scrollWidth - testimonialsScrollContainer.clientWidth;
                let nextScroll = currentScroll + cardWidth;
                if (nextScroll >= maxScroll) testimonialsScrollContainer.scrollTo({ left: 0, behavior: 'smooth' });
                else testimonialsScrollContainer.scrollTo({ left: nextScroll, behavior: 'smooth' });
            }, 2000);
        }

        function stopTestimonialsAutoScroll() {
            if (testimonialsInterval) { clearInterval(testimonialsInterval);
                testimonialsInterval = null; }
        }

        // ============================================================
        // مشاركة المقالات
        // ============================================================
        function shareArticle(url, title, platform) {
            const baseUrl = window.location.origin + window.location.pathname;
            const fullUrl = url.startsWith('http') ? url : baseUrl + (url.startsWith('/') ? '' : '/') + url;
            const encodedUrl = encodeURIComponent(fullUrl);
            const encodedTitle = encodeURIComponent(title || 'Play Ramz');
            const shareUrls = {
                whatsapp: `https://wa.me/?text=${encodedTitle}%20${encodedUrl}`,
                twitter: `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`,
                facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`,
                email: `mailto:?subject=${encodedTitle}&body=${encodedTitle}%0A%0A${encodedUrl}`
            };
            window.open(shareUrls[platform], '_blank', 'width=600,height=400');
        }

        function doSearch(query) {
            const results = document.getElementById('searchResults');
            if (!query.trim()) { results.innerHTML = ''; return; }
            const q = query.trim().toLowerCase();
            const allProducts = [];
            for (const storeId in appData.products) {
                if (appData.products[storeId]) allProducts.push(...appData.products[storeId]);
            }
            const matches = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.desc && p.desc.toLowerCase().includes(q)));
            if (matches.length === 0) {
                results.innerHTML = '<div style="color:var(--text-light);text-align:center;padding:20px;">لا توجد نتائج</div>';
                return;
            }
            let html = `<div class="section-block"><div class="horizontal-scroll-3rows">`;
            matches.forEach(app => { html += appCardHtml(app); });
            html += `</div></div>`;
            results.innerHTML = html;
        }

        // ---- كاروسيل الصور في صفحة التطبيقات ----
        let appsCarouselIndex = 0;
        let appsCarouselTimer = null;

        function setupAppsCarousel() {
            const slides = document.getElementById('appsCarouselSlides');
            if (!slides) return;
            appsCarouselIndex = 0;
            updateAppsCarousel();
            if (appsCarouselTimer) clearInterval(appsCarouselTimer);
            appsCarouselTimer = setInterval(() => changeAppsCarousel(1), 4000);
        }

        function updateAppsCarousel() {
            const slides = document.getElementById('appsCarouselSlides');
            if (!slides) return;
            const total = slides.children.length;
            if (total === 0) return;
            if (appsCarouselIndex >= total) appsCarouselIndex = 0;
            if (appsCarouselIndex < 0) appsCarouselIndex = total - 1;
            slides.style.transform = `translateX(-${appsCarouselIndex * 100}%)`;
        }

        function changeAppsCarousel(dir) {
            const slides = document.getElementById('appsCarouselSlides');
            if (!slides) return;
            const total = slides.children.length;
            if (total === 0) return;
            appsCarouselIndex += dir;
            if (appsCarouselIndex >= total) appsCarouselIndex = 0;
            if (appsCarouselIndex < 0) appsCarouselIndex = total - 1;
            updateAppsCarousel();
            if (appsCarouselTimer) {
                clearInterval(appsCarouselTimer);
                appsCarouselTimer = setInterval(() => changeAppsCarousel(1), 4000);
            }
        }
